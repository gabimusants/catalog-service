services:
  mongodb:
    image: mongo:7
    container_name: catalog-service-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-catalog_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-catalog}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  mongodata: